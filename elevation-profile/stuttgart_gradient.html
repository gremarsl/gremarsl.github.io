<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stuttgart Terrain Gradient — Hiking Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden; }
  body.profile-open #map { height: 65vh; }
  #map { width: 100%; height: 100vh; z-index: 1; transition: height 0.3s ease; }

  /* Glass panel base */
  .glass {
    background: rgba(15, 23, 42, 0.82);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  /* Title bar */
  #title-bar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 1000; padding: 10px 28px;
    display: flex; align-items: center; gap: 12px;
  }
  #title-bar h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap; }
  #title-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }

  /* Legend */
  #legend {
    position: fixed; bottom: 32px; left: 16px; z-index: 1000;
    padding: 16px 20px; min-width: 180px;
  }
  #legend h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 12px; }
  .legend-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 13px; }
  .legend-swatch { width: 28px; height: 14px; border-radius: 4px; flex-shrink: 0; }

  /* Controls panel */
  #controls {
    position: fixed; top: 80px; right: 16px; z-index: 1000;
    padding: 16px 20px; min-width: 220px;
  }
  #controls label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; display: block; margin-bottom: 8px; }
  #controls input[type=range] { width: 100%; accent-color: #6366f1; margin-bottom: 16px; }
  .toggle-group { display: flex; gap: 4px; margin-bottom: 16px; }
  .toggle-btn {
    flex: 1; padding: 7px 0; border: 1px solid rgba(148,163,184,0.2); border-radius: 8px;
    background: transparent; color: #94a3b8; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .toggle-btn.active { background: rgba(99,102,241,0.25); color: #a5b4fc; border-color: rgba(99,102,241,0.5); }
  .toggle-btn.route-active { background: rgba(234,179,8,0.25); color: #fbbf24; border-color: rgba(234,179,8,0.5); }

  /* Profile panel */
  #profile-panel {
    position: fixed; bottom: 0; left: 0; right: 0; height: 35vh;
    z-index: 1001; display: none; flex-direction: column;
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px);
    border-top: 1px solid rgba(148,163,184,0.2);
  }
  #profile-panel.visible { display: flex; }
  #profile-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; border-bottom: 1px solid rgba(148,163,184,0.1);
    flex-shrink: 0;
  }
  #profile-stats { display: flex; gap: 28px; }
  .stat-item { text-align: center; }
  .stat-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
  .stat-value.good { color: #22c55e; }
  .stat-value.moderate { color: #eab308; }
  .stat-value.hard { color: #f97316; }
  .stat-value.extreme { color: #ef4444; }
  #profile-close {
    background: transparent; border: 1px solid rgba(148,163,184,0.2); border-radius: 8px;
    color: #94a3b8; padding: 6px 14px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  #profile-close:hover { background: rgba(148,163,184,0.1); }
  #profile-canvas-wrap { flex: 1; position: relative; padding: 8px 24px 16px; min-height: 0; }
  #profileCanvas { width: 100%; height: 100%; cursor: crosshair; }
  #profile-tooltip {
    position: absolute; pointer-events: none; display: none;
    background: rgba(15,23,42,0.92); border: 1px solid rgba(148,163,184,0.25);
    border-radius: 8px; padding: 8px 12px; font-size: 12px; z-index: 10;
    white-space: nowrap;
  }
  .route-instruction {
    position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
    z-index: 1000; padding: 10px 24px; font-size: 13px; font-weight: 600;
    display: none;
  }
  .route-instruction.visible { display: block; }

  /* Info readout */
  #readout {
    position: fixed; bottom: 32px; right: 16px; z-index: 1000;
    padding: 14px 20px; min-width: 200px;
  }
  .readout-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .readout-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  .readout-value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Leaflet overrides */
  .leaflet-control-zoom { border: none !important; }
  .leaflet-control-zoom a { background: rgba(15,23,42,0.85) !important; color: #e2e8f0 !important; border: 1px solid rgba(148,163,184,0.15) !important; backdrop-filter: blur(12px); }
  .leaflet-control-zoom a:hover { background: rgba(30,41,59,0.9) !important; }
  .leaflet-control-scale-line { background: rgba(15,23,42,0.7) !important; color: #e2e8f0 !important; border-color: rgba(148,163,184,0.3) !important; }

  /* Mobile menu toggle button */
  #mobile-menu-btn {
    display: none;
    position: fixed; top: 16px; right: 16px; z-index: 1100;
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: #e2e8f0; font-size: 18px; cursor: pointer;
    align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: background 0.2s;
  }
  #mobile-menu-btn:active { background: rgba(30, 41, 59, 0.95); }

  /* Mobile drawer overlay */
  #mobile-drawer-overlay {
    display: none; position: fixed; inset: 0; z-index: 1050;
    background: rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.3s;
  }
  #mobile-drawer-overlay.visible { opacity: 1; }

  /* Mobile drawer */
  #mobile-drawer {
    display: none; position: fixed; top: 0; right: 0; bottom: 0;
    z-index: 1060; width: 260px; max-width: 80vw;
    background: rgba(15, 23, 42, 0.97); backdrop-filter: blur(20px);
    border-left: 1px solid rgba(148,163,184,0.15);
    transform: translateX(100%); transition: transform 0.3s ease;
    overflow-y: auto; padding: 60px 16px 24px;
    box-shadow: -4px 0 24px rgba(0,0,0,0.4);
  }
  #mobile-drawer.visible { transform: translateX(0); }
  #mobile-drawer .drawer-section { margin-bottom: 20px; }
  #mobile-drawer .drawer-section h3 {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: #64748b; margin-bottom: 8px;
  }
  #mobile-drawer .legend-row { margin-bottom: 4px; font-size: 12px; }
  #mobile-drawer .legend-swatch { width: 22px; height: 10px; border-radius: 3px; }
  #mobile-drawer label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: #94a3b8; display: block; margin-bottom: 6px;
  }
  #mobile-drawer input[type=range] { width: 100%; accent-color: #6366f1; margin-bottom: 12px; }
  #mobile-drawer .toggle-group { display: flex; gap: 4px; margin-bottom: 12px; }
  #mobile-drawer .toggle-btn {
    flex: 1; padding: 6px 0; border: 1px solid rgba(148,163,184,0.2); border-radius: 8px;
    background: transparent; color: #94a3b8; font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  #mobile-drawer .toggle-btn.active { background: rgba(99,102,241,0.25); color: #a5b4fc; border-color: rgba(99,102,241,0.5); }
  #mobile-drawer .toggle-btn.route-active { background: rgba(234,179,8,0.25); color: #fbbf24; border-color: rgba(234,179,8,0.5); }

  /* ======== MOBILE RESPONSIVE ======== */
  @media (max-width: 768px) {
    #mobile-menu-btn { display: flex; }
    #mobile-drawer { display: block; }
    #mobile-drawer-overlay { display: block; }

    /* Hide desktop panels */
    #legend, #controls { display: none !important; }

    /* Title bar: smaller */
    #title-bar { padding: 7px 16px; top: 12px; }
    #title-bar h1 { font-size: 13px; }
    #title-bar .dot { width: 6px; height: 6px; }

    /* Readout: smaller and repositioned */
    #readout {
      bottom: 12px; right: 8px; left: auto;
      padding: 8px 12px; min-width: auto;
      border-radius: 10px;
    }
    .readout-row { margin-bottom: 2px; }
    .readout-label { font-size: 9px; }
    .readout-value { font-size: 12px; }
    #coords { font-size: 10px !important; }

    /* Profile panel: take more screen space on mobile */
    #profile-panel { height: 42vh; }
    body.profile-open #map { height: 58vh; }

    #profile-header { padding: 8px 12px; flex-wrap: wrap; gap: 6px; }
    #profile-stats { gap: 12px; flex-wrap: wrap; }
    .stat-value { font-size: 13px; }
    .stat-label { font-size: 8px; letter-spacing: 0.5px; }
    #profile-close { padding: 5px 10px; font-size: 11px; }
    #profile-canvas-wrap { padding: 4px 12px 10px; }

    /* Route instruction */
    .route-instruction { bottom: 56px; padding: 8px 16px; font-size: 12px; border-radius: 10px; }

    /* Leaflet zoom controls: reposition */
    .leaflet-top.leaflet-left { top: 52px; }
  }

  /* Extra small screens (iPhone SE, etc.) */
  @media (max-width: 375px) {
    #title-bar h1 { font-size: 11px; }
    #title-bar { padding: 6px 12px; }
    #readout { padding: 6px 10px; }
    .readout-label { font-size: 8px; }
    .readout-value { font-size: 11px; }
    #profile-panel { height: 45vh; }
    body.profile-open #map { height: 55vh; }
    .stat-value { font-size: 12px; }
    #profile-stats { gap: 8px; }
  }
</style>
</head>
<body>

<div id="title-bar" class="glass">
  <div class="dot"></div>
  <h1>Stuttgart Terrain Gradient</h1>
</div>

<!-- Mobile menu button -->
<button id="mobile-menu-btn" aria-label="Open menu">☰</button>

<!-- Mobile drawer overlay -->
<div id="mobile-drawer-overlay"></div>

<!-- Mobile drawer (legend + controls combined) -->
<div id="mobile-drawer">
  <div class="drawer-section">
    <h3>Slope Gradient</h3>
    <div class="legend-row"><div class="legend-swatch" style="background:#22c55e"></div><span>0–3° Flat</span></div>
    <div class="legend-row"><div class="legend-swatch" style="background:#84cc16"></div><span>3–8° Gentle</span></div>
    <div class="legend-row"><div class="legend-swatch" style="background:#eab308"></div><span>8–15° Moderate</span></div>
    <div class="legend-row"><div class="legend-swatch" style="background:#f97316"></div><span>15–25° Steep</span></div>
    <div class="legend-row"><div class="legend-swatch" style="background:#ef4444"></div><span>25–35° Very Steep</span></div>
    <div class="legend-row"><div class="legend-swatch" style="background:#7c3aed"></div><span>35°+ Extreme</span></div>
  </div>
  <div class="drawer-section">
    <label>Overlay Opacity</label>
    <input type="range" class="mobile-opacity-slider" min="0" max="100" value="50">
    <label>Base Map</label>
    <div class="toggle-group">
      <button class="toggle-btn active" data-layer="osm" data-mobile="true">Street</button>
      <button class="toggle-btn" data-layer="topo" data-mobile="true">Topo</button>
    </div>
    <label>Slope Overlay</label>
    <div class="toggle-group">
      <button class="toggle-btn active mobile-slope-toggle">On</button>
    </div>
    <label>Route Profile</label>
    <div class="toggle-group">
      <button class="toggle-btn mobile-route-toggle">📍 Set A → B</button>
    </div>
    <button class="mobile-route-clear" style="display:none;width:100%;padding:6px 0;border:1px solid rgba(239,68,68,0.3);border-radius:8px;background:rgba(239,68,68,0.1);color:#fca5a5;font-size:11px;font-weight:600;cursor:pointer;">✕ Clear Route</button>
  </div>
</div>

<div id="legend" class="glass">
  <h3>Slope Gradient</h3>
  <div class="legend-row"><div class="legend-swatch" style="background:#22c55e"></div><span>0–3° Flat</span></div>
  <div class="legend-row"><div class="legend-swatch" style="background:#84cc16"></div><span>3–8° Gentle</span></div>
  <div class="legend-row"><div class="legend-swatch" style="background:#eab308"></div><span>8–15° Moderate</span></div>
  <div class="legend-row"><div class="legend-swatch" style="background:#f97316"></div><span>15–25° Steep</span></div>
  <div class="legend-row"><div class="legend-swatch" style="background:#ef4444"></div><span>25–35° Very Steep</span></div>
  <div class="legend-row"><div class="legend-swatch" style="background:#7c3aed"></div><span>35°+ Extreme</span></div>
</div>

<div id="controls" class="glass">
  <label>Overlay Opacity</label>
  <input type="range" id="opacitySlider" min="0" max="100" value="50">
  <label>Base Map</label>
  <div class="toggle-group">
    <button class="toggle-btn active" data-layer="osm">Street</button>
    <button class="toggle-btn" data-layer="topo">Topo</button>
  </div>
  <label>Slope Overlay</label>
  <div class="toggle-group">
    <button class="toggle-btn active" id="slopeToggle">On</button>
  </div>
  <label>Route Profile</label>
  <div class="toggle-group">
    <button class="toggle-btn" id="routeToggle">📍 Set A → B</button>
  </div>
  <button id="routeClear" style="display:none;width:100%;padding:7px 0;border:1px solid rgba(239,68,68,0.3);border-radius:8px;background:rgba(239,68,68,0.1);color:#fca5a5;font-size:12px;font-weight:600;cursor:pointer;">✕ Clear Route</button>
</div>

<div id="readout" class="glass">
  <div class="readout-row"><span class="readout-label">Elevation</span><span class="readout-value" id="elev">— m</span></div>
  <div class="readout-row"><span class="readout-label">Slope</span><span class="readout-value" id="slope">— °</span></div>
  <div class="readout-row"><span class="readout-label">Lat, Lng</span><span class="readout-value" id="coords" style="font-size:12px">—</span></div>
</div>

<div id="route-instruction" class="glass route-instruction">Click map to set point <strong>A</strong></div>

<div id="map"></div>

<div id="profile-panel">
  <div id="profile-header">
    <div id="profile-stats"></div>
    <button id="profile-close">✕ Close</button>
  </div>
  <div id="profile-canvas-wrap">
    <canvas id="profileCanvas"></canvas>
    <div id="profile-tooltip"></div>
  </div>
</div>

<script>
(function() {
  // === Config ===
  const STUTTGART = [48.7758, 9.1829];
  const RADIUS_KM = 30;
  const TERRARIUM_URL = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';

  // === Slope color ramp ===
  function slopeColor(deg) {
    if (deg < 3)  return [34, 197, 94];
    if (deg < 8)  return [132, 204, 22];
    if (deg < 15) return [234, 179, 8];
    if (deg < 25) return [249, 115, 22];
    if (deg < 35) return [239, 68, 68];
    return [124, 58, 237];
  }

  // === Terrarium decode ===
  function terrariumElevation(r, g, b) {
    return (r * 256 + g + b / 256) - 32768;
  }

  // === Ground resolution (meters per pixel) ===
  function metersPerPixel(lat, zoom) {
    return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
  }

  // === Custom Slope GridLayer ===
  const SlopeLayer = L.GridLayer.extend({
    createTile: function(coords, done) {
      const tile = document.createElement('canvas');
      const size = this.getTileSize();
      tile.width = size.x;
      tile.height = size.y;

      const url = TERRARIUM_URL
        .replace('{z}', coords.z)
        .replace('{x}', coords.x)
        .replace('{y}', coords.y);

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        const offscreen = document.createElement('canvas');
        offscreen.width = size.x;
        offscreen.height = size.y;
        const offCtx = offscreen.getContext('2d');
        offCtx.drawImage(img, 0, 0, size.x, size.y);

        let data;
        try {
          data = offCtx.getImageData(0, 0, size.x, size.y).data;
        } catch (e) {
          done(e, tile);
          return;
        }

        // Build elevation grid
        const w = size.x, h = size.y;
        const elev = new Float32Array(w * h);
        for (let i = 0; i < w * h; i++) {
          const idx = i * 4;
          elev[i] = terrariumElevation(data[idx], data[idx+1], data[idx+2]);
        }

        // Compute tile center lat for resolution
        const nw = L.CRS.EPSG3857.pointToLatLng(
          L.point(coords.x * size.x, coords.y * size.y), coords.z
        );
        const se = L.CRS.EPSG3857.pointToLatLng(
          L.point((coords.x+1) * size.x, (coords.y+1) * size.y), coords.z
        );
        const centerLat = (nw.lat + se.lat) / 2;
        const mpp = metersPerPixel(centerLat, coords.z);

        // Calculate slope and paint
        const ctx = tile.getContext('2d');
        const imgData = ctx.createImageData(w, h);
        const out = imgData.data;

        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const idx = y * w + x;
            const dzdx = (elev[idx + 1] - elev[idx - 1]) / (2 * mpp);
            const dzdy = (elev[idx - w] - elev[idx + w]) / (2 * mpp);
            const slopeDeg = Math.atan(Math.sqrt(dzdx * dzdx + dzdy * dzdy)) * (180 / Math.PI);

            const c = slopeColor(slopeDeg);
            const px = idx * 4;
            out[px]     = c[0];
            out[px + 1] = c[1];
            out[px + 2] = c[2];
            out[px + 3] = 180; // base alpha
          }
        }

        ctx.putImageData(imgData, 0, 0);
        done(null, tile);
      };
      img.onerror = function() { done(new Error('Tile load failed'), tile); };
      img.src = url;

      return tile;
    }
  });

  // === Map setup ===
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  });
  const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    attribution: '&copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
  });

  const map = L.map('map', {
    center: STUTTGART,
    zoom: 11,
    layers: [osm],
    zoomControl: true
  });

  // Custom pane for slope overlay — z-index above base tiles (200) but below popups (700)
  map.createPane('slopePane');
  map.getPane('slopePane').style.zIndex = 450;
  map.getPane('slopePane').style.pointerEvents = 'none';

  L.control.scale({ imperial: false }).addTo(map);

  // 30km radius circle
  L.circle(STUTTGART, {
    radius: RADIUS_KM * 1000,
    color: '#6366f1',
    weight: 2,
    dashArray: '8 6',
    fillColor: 'transparent',
    fillOpacity: 0,
    interactive: false
  }).addTo(map);

  // Small center marker
  L.circleMarker(STUTTGART, { radius: 5, color: '#6366f1', fillColor: '#a5b4fc', fillOpacity: 1, weight: 2 })
    .bindTooltip('Stuttgart', { permanent: false, direction: 'top' })
    .addTo(map);

  // Slope overlay — rendered in dedicated pane so it stays above any base layer
  const slopeLayer = new SlopeLayer({ maxZoom: 15, opacity: 0.5, pane: 'slopePane' });
  slopeLayer.addTo(map);

  // === Controls ===
  // Opacity slider — directly set pane opacity for reliable canvas layer control
  const slopePane = map.getPane('slopePane');
  document.getElementById('opacitySlider').addEventListener('input', function() {
    slopePane.style.opacity = this.value / 100;
  });

  // Base layer toggle
  const toggleBtns = document.querySelectorAll('.toggle-btn[data-layer]');
  const layers = { osm, topo };
  toggleBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      toggleBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      const key = this.dataset.layer;
      Object.values(layers).forEach(l => map.removeLayer(l));
      layers[key].addTo(map);
    });
  });

  // Slope toggle
  const slopeToggle = document.getElementById('slopeToggle');
  let slopeVisible = true;
  slopeToggle.addEventListener('click', function() {
    slopeVisible = !slopeVisible;
    if (slopeVisible) {
      slopeLayer.addTo(map);
      this.classList.add('active');
      this.textContent = 'On';
    } else {
      map.removeLayer(slopeLayer);
      this.classList.remove('active');
      this.textContent = 'Off';
    }
  });

  // === Elevation readout on hover ===
  // We keep a small cache of loaded tile canvases for readout
  const tileCache = new Map();
  const TILE_SIZE = 256;

  function latlngToTile(lat, lng, zoom) {
    const x = Math.floor((lng + 180) / 360 * Math.pow(2, zoom));
    const n = Math.PI - 2 * Math.PI * lat / 180;
    const y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom));
    return { x, y, z: zoom };
  }

  function latlngToPixelInTile(lat, lng, zoom) {
    const n = Math.pow(2, zoom);
    const xTile = (lng + 180) / 360 * n;
    const latRad = lat * Math.PI / 180;
    const yTile = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
    const px = Math.floor((xTile - Math.floor(xTile)) * TILE_SIZE);
    const py = Math.floor((yTile - Math.floor(yTile)) * TILE_SIZE);
    return { px, py };
  }

  // Queue for pending callbacks when a tile is still loading
  const pendingCallbacks = new Map();

  function getElevationAt(lat, lng, callback) {
    const zoom = Math.min(map.getZoom(), 15);
    const tile = latlngToTile(lat, lng, zoom);
    const key = `${tile.z}/${tile.x}/${tile.y}`;
    const pixel = latlngToPixelInTile(lat, lng, zoom);

    if (tileCache.has(key)) {
      const cached = tileCache.get(key);
      if (cached === 'loading') {
        // Tile still loading — queue this callback for later
        if (!pendingCallbacks.has(key)) pendingCallbacks.set(key, []);
        pendingCallbacks.get(key).push({ pixel, lat, zoom, callback });
        return;
      }
      readPixel(cached, pixel, lat, zoom, callback);
      return;
    }

    tileCache.set(key, 'loading');
    const url = TERRARIUM_URL.replace('{z}', tile.z).replace('{x}', tile.x).replace('{y}', tile.y);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      const c = document.createElement('canvas');
      c.width = TILE_SIZE; c.height = TILE_SIZE;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      tileCache.set(key, ctx);
      // Limit cache size
      if (tileCache.size > 100) {
        const first = tileCache.keys().next().value;
        tileCache.delete(first);
      }
      // Process the original callback
      readPixel(ctx, pixel, lat, zoom, callback);
      // Process any queued callbacks for this tile
      if (pendingCallbacks.has(key)) {
        for (const pending of pendingCallbacks.get(key)) {
          readPixel(ctx, pending.pixel, pending.lat, pending.zoom, pending.callback);
        }
        pendingCallbacks.delete(key);
      }
    };
    img.onerror = function() {
      tileCache.delete(key);
      // Fire queued callbacks with null so they don't block forever
      if (pendingCallbacks.has(key)) {
        for (const pending of pendingCallbacks.get(key)) {
          pending.callback(0, 0);
        }
        pendingCallbacks.delete(key);
      }
    };
    img.src = url;
  }

  function readPixel(ctx, pixel, lat, zoom, callback) {
    try {
      const d = ctx.getImageData(pixel.px, pixel.py, 1, 1).data;
      const elevation = terrariumElevation(d[0], d[1], d[2]);

      // Approximate slope from neighbors
      const mpp = metersPerPixel(lat, zoom);
      let slopeDeg = 0;
      if (pixel.px > 0 && pixel.px < TILE_SIZE - 1 && pixel.py > 0 && pixel.py < TILE_SIZE - 1) {
        const left = ctx.getImageData(pixel.px - 1, pixel.py, 1, 1).data;
        const right = ctx.getImageData(pixel.px + 1, pixel.py, 1, 1).data;
        const top = ctx.getImageData(pixel.px, pixel.py - 1, 1, 1).data;
        const bottom = ctx.getImageData(pixel.px, pixel.py + 1, 1, 1).data;
        const eL = terrariumElevation(left[0], left[1], left[2]);
        const eR = terrariumElevation(right[0], right[1], right[2]);
        const eT = terrariumElevation(top[0], top[1], top[2]);
        const eB = terrariumElevation(bottom[0], bottom[1], bottom[2]);
        const dzdx = (eR - eL) / (2 * mpp);
        const dzdy = (eT - eB) / (2 * mpp);
        slopeDeg = Math.atan(Math.sqrt(dzdx * dzdx + dzdy * dzdy)) * (180 / Math.PI);
      }
      callback(elevation, slopeDeg);
    } catch(e) { /* CORS or out of bounds */ }
  }

  // Throttled mousemove
  let lastReadout = 0;
  map.on('mousemove', function(e) {

  // Fetch cycling route from OSRM
  async function fetchRoute(a, b) {
    const url = `https://router.project-osrm.org/route/v1/cycling/${a.lng},${a.lat};${b.lng},${b.lat}?geometries=geojson&overview=full`;
    try {
      const res = await fetch(url);
      const data = await res.json();
      if (data.code !== 'Ok' || !data.routes.length) {
        routeInstruction.innerHTML = '❌ No route found';
        setTimeout(() => exitRouteMode(), 2000);
        return;
      }
      const route = data.routes[0];
      const coords = route.geometry.coordinates; // [lng, lat] pairs
      const latlngs = coords.map(c => [c[1], c[0]]);

      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline(latlngs, {
        color: '#6366f1', weight: 4, opacity: 0.9
      }).addTo(map);

      map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
      routeClear.style.display = 'block';
      exitRouteMode();

      // Sample elevation along route
      routeInstruction.innerHTML = '⏳ Sampling elevation...';
      routeInstruction.classList.add('visible');
      await sampleElevation(latlngs, route.distance);
      routeInstruction.classList.remove('visible');
    } catch (err) {
      routeInstruction.innerHTML = '❌ Routing error';
      setTimeout(() => exitRouteMode(), 2000);
    }
  }

  // Sample elevation along route polyline
  function sampleElevation(latlngs, totalDistMeters) {
    return new Promise(resolve => {
      // Subsample to ~200 points for performance
      const NUM_SAMPLES = 200;
      const sampled = subsamplePath(latlngs, NUM_SAMPLES);

      profileData = [];
      let completed = 0;

      sampled.forEach((pt, i) => {
        getElevationAt(pt.lat, pt.lng, function(elev) {
          profileData[i] = { lat: pt.lat, lng: pt.lng, dist: pt.dist, elev: elev };
          completed++;
          if (completed === sampled.length) {
            // Compute grades
            for (let j = 1; j < profileData.length; j++) {
              const dElev = profileData[j].elev - profileData[j-1].elev;
              const dDist = profileData[j].dist - profileData[j-1].dist;
              profileData[j].grade = dDist > 0 ? (dElev / dDist) * 100 : 0;
            }
            profileData[0].grade = profileData.length > 1 ? profileData[1].grade : 0;
            renderProfile();
            resolve();
          }
        });
      });
    });
  }

  // Subsample a path into N evenly-spaced points
  function subsamplePath(latlngs, n) {
    // Compute cumulative distances
    const dists = [0];
    for (let i = 1; i < latlngs.length; i++) {
      const d = haversine(latlngs[i-1][0], latlngs[i-1][1], latlngs[i][0], latlngs[i][1]);
      dists.push(dists[i-1] + d);
    }
    const totalDist = dists[dists.length - 1];
    const step = totalDist / (n - 1);
    const result = [];
    let j = 0;
    for (let i = 0; i < n; i++) {
      const targetDist = i * step;
      while (j < dists.length - 2 && dists[j+1] < targetDist) j++;
      const segLen = dists[j+1] - dists[j];
      const t = segLen > 0 ? (targetDist - dists[j]) / segLen : 0;
      const lat = latlngs[j][0] + t * (latlngs[j+1][0] - latlngs[j][0]);
      const lng = latlngs[j][1] + t * (latlngs[j+1][1] - latlngs[j][1]);
      result.push({ lat, lng, dist: targetDist });
    }
    return result;
  }

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // Render elevation profile with gradient coloring
  function renderProfile() {
    if (!profileData.length) return;

    profilePanel.classList.add('visible');
    document.body.classList.add('profile-open');
    setTimeout(() => map.invalidateSize(), 350);

    // Compute stats
    const totalDist = profileData[profileData.length-1].dist;
    let totalAscent = 0, totalDescent = 0, maxGrade = 0;
    const elevs = profileData.map(p => p.elev);
    const minElev = Math.min(...elevs), maxElev = Math.max(...elevs);
    for (let i = 1; i < profileData.length; i++) {
      const dE = profileData[i].elev - profileData[i-1].elev;
      if (dE > 0) totalAscent += dE;
      else totalDescent += Math.abs(dE);
      maxGrade = Math.max(maxGrade, Math.abs(profileData[i].grade));
    }

    // Bike assessment
    let bikeClass, bikeLabel;
    if (maxGrade < 6) { bikeClass = 'good'; bikeLabel = '✅ Easy ride'; }
    else if (maxGrade < 10) { bikeClass = 'moderate'; bikeLabel = '⚠️ Moderate'; }
    else if (maxGrade < 15) { bikeClass = 'hard'; bikeLabel = '🔶 Challenging'; }
    else { bikeClass = 'extreme'; bikeLabel = '🔴 Very hard'; }

    document.getElementById('profile-stats').innerHTML = `
      <div class="stat-item"><div class="stat-value">${(totalDist/1000).toFixed(1)} km</div><div class="stat-label">Distance</div></div>
      <div class="stat-item"><div class="stat-value">↑ ${Math.round(totalAscent)} m</div><div class="stat-label">Ascent</div></div>
      <div class="stat-item"><div class="stat-value">↓ ${Math.round(totalDescent)} m</div><div class="stat-label">Descent</div></div>
      <div class="stat-item"><div class="stat-value">${minElev.toFixed(0)}–${maxElev.toFixed(0)} m</div><div class="stat-label">Elevation</div></div>
      <div class="stat-item"><div class="stat-value">${maxGrade.toFixed(1)}%</div><div class="stat-label">Max Grade</div></div>
      <div class="stat-item"><div class="stat-value ${bikeClass}">${bikeLabel}</div><div class="stat-label">Bike</div></div>
    `;

    drawProfileCanvas();
  }

  function gradeColor(grade) {
    const g = Math.abs(grade);
    if (g < 3)  return '#22c55e';
    if (g < 6)  return '#84cc16';
    if (g < 10) return '#eab308';
    if (g < 15) return '#f97316';
    if (g < 20) return '#ef4444';
    return '#7c3aed';
  }

  function drawProfileCanvas() {
    const canvas = profileCanvas;
    const wrap = document.getElementById('profile-canvas-wrap');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = wrap.clientWidth * dpr;
    canvas.height = wrap.clientHeight * dpr;
    canvas.style.width = wrap.clientWidth + 'px';
    canvas.style.height = wrap.clientHeight + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = wrap.clientWidth, H = wrap.clientHeight;

    const PAD_LEFT = 50, PAD_RIGHT = 20, PAD_TOP = 16, PAD_BOTTOM = 32;
    const plotW = W - PAD_LEFT - PAD_RIGHT;
    const plotH = H - PAD_TOP - PAD_BOTTOM;

    const elevs = profileData.map(p => p.elev);
    const minE = Math.min(...elevs) - 10;
    const maxE = Math.max(...elevs) + 10;
    const totalDist = profileData[profileData.length-1].dist;

    function xPos(dist) { return PAD_LEFT + (dist / totalDist) * plotW; }
    function yPos(elev) { return PAD_TOP + plotH - ((elev - minE) / (maxE - minE)) * plotH; }

    // Clear
    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = 'rgba(148,163,184,0.1)';
    ctx.lineWidth = 1;
    const elevStep = niceStep(maxE - minE, 5);
    for (let e = Math.ceil(minE / elevStep) * elevStep; e <= maxE; e += elevStep) {
      const y = yPos(e);
      ctx.beginPath(); ctx.moveTo(PAD_LEFT, y); ctx.lineTo(W - PAD_RIGHT, y); ctx.stroke();
      ctx.fillStyle = '#64748b'; ctx.font = '11px Inter';
      ctx.textAlign = 'right'; ctx.fillText(Math.round(e) + 'm', PAD_LEFT - 8, y + 4);
    }
    // Distance labels
    const distStep = niceStep(totalDist / 1000, 5);
    for (let d = 0; d <= totalDist / 1000; d += distStep) {
      const x = xPos(d * 1000);
      ctx.fillStyle = '#64748b'; ctx.font = '11px Inter';
      ctx.textAlign = 'center'; ctx.fillText(d.toFixed(1) + 'km', x, H - 8);
    }

    // Filled gradient profile
    for (let i = 1; i < profileData.length; i++) {
      const x1 = xPos(profileData[i-1].dist);
      const x2 = xPos(profileData[i].dist);
      const y1 = yPos(profileData[i-1].elev);
      const y2 = yPos(profileData[i].elev);
      const color = gradeColor(profileData[i].grade);

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x2, PAD_TOP + plotH);
      ctx.lineTo(x1, PAD_TOP + plotH);
      ctx.closePath();
      ctx.fillStyle = color + '55';
      ctx.fill();

      // Top line
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function niceStep(range, targetSteps) {
    const rough = range / targetSteps;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    let nice;
    if (norm < 1.5) nice = 1;
    else if (norm < 3) nice = 2;
    else if (norm < 7) nice = 5;
    else nice = 10;
    return nice * mag;
  }

    hoverMarker = L.circleMarker([pt.lat, pt.lng], {
      radius: 6, color: '#fff', fillColor: gradeColor(pt.grade), fillOpacity: 1, weight: 2
    }).addTo(map);
  }, { passive: false });

  profileCanvas.addEventListener('touchend', function() {
    profileTooltip.style.display = 'none';
    if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
  });

})();
</script>
</body>
</html>
